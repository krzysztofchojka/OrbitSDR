name: Build OrbitSDR

on:
  push:
    branches: [ "main", "master", "test-ci"]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------
  # LINUX (Your working setup)
  # --------------------------------------------------------
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential librtlsdr-dev libgl1-mesa-dev libudev-dev libopenal-dev libvorbis-dev libflac-dev libfreetype6-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev
    - name: Install SFML 3.0
      run: |
        tar -xzf $GITHUB_WORKSPACE/deps/SFML-3.0.0-linux-gcc-64-bit.tar.gz
        mv SFML-3.0.0 sfml
    - name: Compile OrbitSDR
      run: |
        chmod +x build.sh
        SFML_PATH="$GITHUB_WORKSPACE/sfml"
        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/linux"
        export CXXFLAGS="-I$SFML_PATH/include -I$SDR_INC"
        export LDFLAGS="-Wl,-rpath,'\$ORIGIN/libs'"
        export LIBS="-L$SFML_PATH/lib -L$SDR_LIB -lsfml-graphics -lsfml-window -lsfml-system -ldl -lpthread -lm -lrtlsdr -lsdrplay_api"
        ./build.sh --enable-sdrplay
    - name: Create Bundle
      run: |
        mkdir -p OrbitSDR_Linux/libs
        cp orbitsdr OrbitSDR_Linux/OrbitSDR
        cp icon.png OrbitSDR_Linux/ || true
        cp sfml/lib/*.so* OrbitSDR_Linux/libs/
        cp deps/sdrplay/lib/linux/*.so* OrbitSDR_Linux/libs/
        cat > OrbitSDR_Linux/OrbitSDR_Run.sh <<EOF
        #!/bin/bash
        cd "\$(dirname "\$0")"
        export LD_LIBRARY_PATH="\$LD_LIBRARY_PATH:./libs"
        ./OrbitSDR
        EOF
        chmod +x OrbitSDR_Linux/OrbitSDR_Run.sh
    - uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-Linux
        path: OrbitSDR_Linux/

  # --------------------------------------------------------
  # MACOS (The Fixed "Manual" Method)
  # --------------------------------------------------------
  build-macos:
    name: macOS (Universal)
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew update
        brew install sfml librtlsdr 
        # Note: We are NOT installing dylibbundler because it causes the hang.

    - name: Compile OrbitSDR
      run: |
        chmod +x build.sh
        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/macos"

        # 1. Compilation Flags
        export CXXFLAGS="-I$SDR_INC"
        
        # 2. Linker Flags
        # We explicitly link the library. The binary will "remember" it as libsdrplay_api.so.3
        export LDFLAGS="-L/opt/homebrew/lib -L$SDR_LIB -lsdrplay_api"
        
        ./build.sh --enable-sdrplay

    - name: Manual Packaging (NO dylibbundler)
      run: |
        # 1. Create a clean folder
        mkdir -p OrbitSDR_MacOS
        
        # 2. Copy the executable
        cp orbitsdr OrbitSDR_MacOS/OrbitSDR
        
        # 3. Copy the SDRPlay library manually
        cp deps/sdrplay/lib/macos/libsdrplay_api.dylib OrbitSDR_MacOS/libsdrplay_api.dylib
        
        # 4. FIX THE BINARY (The "Magic" Step)
        # The binary thinks it needs "libsdrplay_api.so.3".
        # We force it to look for "@executable_path/libsdrplay_api.dylib" instead.
        # This completely prevents the "File not found" error.
        install_name_tool -change libsdrplay_api.so.3 @executable_path/libsdrplay_api.dylib OrbitSDR_MacOS/OrbitSDR
        
        # 5. Verify it worked (prints output to log, doesn't hang)
        otool -L OrbitSDR_MacOS/OrbitSDR
        
        # 6. Sign it
        codesign --force --deep --sign - OrbitSDR_MacOS/OrbitSDR

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-macOS
        path: OrbitSDR_MacOS/