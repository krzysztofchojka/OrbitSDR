name: Build OrbitSDR

on:
  push:
    branches: [ "main", "master", "test-ci" ]
    tags: [ "v*" ]            # pushing a tag like v1.0.0 also creates a GitHub Release
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # --------------------------------------------------------
  # WINDOWS x64 (MinGW64): portable zip + installer
  # --------------------------------------------------------
  build-windows-mingw:
    name: Windows x64 (MinGW64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup MSYS2 (gcc, make, rtl-sdr)
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-rtl-sdr
            mingw-w64-ucrt-x86_64-make
            unzip
            wget

      # 2. Download SFML 3.0 (MinGW version)
      - name: Download SFML 3.0 (MinGW)
        shell: msys2 {0}
        run: |
          wget -q https://github.com/SFML/SFML/releases/download/3.0.0/SFML-3.0.0-windows-gcc-14.2.0-mingw-64-bit.zip -O sfml.zip
          unzip -q sfml.zip
          mv SFML-3.0.0 sfml

      # 3. Compilation and packaging (copies exe + all DLLs next to each other)
      - name: Compile OrbitSDR
        shell: msys2 {0}
        run: |
          chmod +x build_mingw.sh
          ./build_mingw.sh

      - name: Determine version
        shell: pwsh
        run: |
          $ver = "0.0.0-dev"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 4. Portable zip
      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path orbitsdr.exe, *.dll, bandplan.json -DestinationPath OrbitSDR-windows-x64-portable.zip

      # 5. Installer (Inno Setup)
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" installer\orbitsdr.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer_output

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitSDR-windows-x64
          path: |
            OrbitSDR-windows-x64-portable.zip
            installer_output/OrbitSDR-Setup-*.exe

  # --------------------------------------------------------
  # LINUX: amd64 + arm64  (portable tar.gz + .deb)
  #  - amd64 : Ubuntu 24.04, prebuilt SFML 3 from deps/
  #  - arm64 : Ubuntu 22.04 ARM (older glibc => also runs on Raspberry Pi OS Bookworm),
  #            SFML 3 is built from source (no prebuilt ARM package exists), cached.
  # --------------------------------------------------------
  build-linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            sfml_from_source: false
            sdr_dir: linux
            multiarch: x86_64-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            sfml_from_source: true
            sdr_dir: linux-arm64
            multiarch: aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git librtlsdr-dev libgl1-mesa-dev libudev-dev libopenal-dev libvorbis-dev libflac-dev libfreetype6-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev

      # --- SFML 3.0: prebuilt (amd64) ---
      - name: Install SFML 3.0 (prebuilt)
        if: ${{ !matrix.sfml_from_source }}
        run: |
          tar -xzf $GITHUB_WORKSPACE/deps/SFML-3.0.0-linux-gcc-64-bit.tar.gz
          mv SFML-3.0.0 sfml

      # --- SFML 3.0: built from source (arm64), cached ---
      - name: Cache SFML build
        if: ${{ matrix.sfml_from_source }}
        id: sfml-cache
        uses: actions/cache@v4
        with:
          path: sfml
          key: sfml-3.0.0-${{ matrix.runner }}-v1

      - name: Build SFML 3.0 from source
        if: ${{ matrix.sfml_from_source && steps.sfml-cache.outputs.cache-hit != 'true' }}
        run: |
          git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git sfml-src
          cmake -S sfml-src -B sfml-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSFML_BUILD_AUDIO=OFF \
            -DSFML_BUILD_NETWORK=OFF \
            -DSFML_BUILD_EXAMPLES=OFF \
            -DSFML_BUILD_DOC=OFF \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sfml"
          cmake --build sfml-build -j"$(nproc)"
          cmake --install sfml-build

      - name: Show SFML layout
        run: |
          ls sfml
          ls sfml/lib | head -30

      # --- SDRplay API: pick the right architecture folder and create .so / .so.3 ---
      - name: Prepare SDRplay API library
        run: |
          SDR_SRC="deps/sdrplay/lib/${{ matrix.sdr_dir }}"
          ls -la "$SDR_SRC"
          SRC_FILE=$(ls "$SDR_SRC"/libsdrplay_api.so* | head -n1)
          mkdir -p sdrlib
          cp -L "$SRC_FILE" sdrlib/libsdrplay_api.so.3     # SONAME used at runtime
          cp -L "$SRC_FILE" sdrlib/libsdrplay_api.so       # name used by the linker (-lsdrplay_api)
          file sdrlib/libsdrplay_api.so.3

      - name: Compile OrbitSDR
        run: |
          chmod +x build.sh
          SFML_PATH="$GITHUB_WORKSPACE/sfml"
          SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
          SDR_LIB="$GITHUB_WORKSPACE/sdrlib"
          export CXXFLAGS="-I$SFML_PATH/include -I$SDR_INC"
          export LDFLAGS='-Wl,-rpath,$ORIGIN/libs'
          export LIBS="-L$SFML_PATH/lib -L$SDR_LIB -lsfml-graphics -lsfml-window -lsfml-system -ldl -lpthread -lm -lrtlsdr -lsdrplay_api"
          ./build.sh --enable-sdrplay
          file orbitsdr

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create Bundle
        run: |
          mkdir -p OrbitSDR_Linux/libs
          cp orbitsdr OrbitSDR_Linux/OrbitSDR
          cp icon.png OrbitSDR_Linux/ || true
          cp bandplan.json OrbitSDR_Linux/ || true
          cp LICENSE OrbitSDR_Linux/ || true

          # Copy real files (-L) so symlinks do not disappear in archives
          cp -L sfml/lib/*.so* OrbitSDR_Linux/libs/
          cp -L sdrlib/libsdrplay_api.so.3 OrbitSDR_Linux/libs/
          cp -L /usr/lib/${{ matrix.multiarch }}/librtlsdr.so* OrbitSDR_Linux/libs/ || true

          cat > OrbitSDR_Linux/OrbitSDR_Run.sh << 'EOF'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x ./OrbitSDR 2>/dev/null || true
          export LD_LIBRARY_PATH="$(pwd)/libs:$LD_LIBRARY_PATH"
          ./OrbitSDR
          EOF
          chmod +x OrbitSDR_Linux/OrbitSDR_Run.sh OrbitSDR_Linux/OrbitSDR

      - name: Create portable tar.gz
        run: |
          tar -czf OrbitSDR-linux-${{ matrix.arch }}.tar.gz OrbitSDR_Linux

      - name: Create .deb package
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh OrbitSDR_Linux "${{ matrix.arch }}" "$VERSION" "orbitsdr_${VERSION}_${{ matrix.arch }}.deb"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrbitSDR-linux-${{ matrix.arch }}
          path: |
            OrbitSDR-linux-${{ matrix.arch }}.tar.gz
            orbitsdr_*.deb

  # --------------------------------------------------------
  # MACOS (works on macOS 15 Sequoia AND macOS 26 Tahoe) - unchanged
  # - runner pinned to macos-15, so Homebrew libs are built for macOS 15
  # - MACOSX_DEPLOYMENT_TARGET=15.0, so the binary accepts macOS 15+
  # - all dylibs are bundled inside the .app (no Homebrew needed on your Mac)
  # --------------------------------------------------------
  build-macos:
    name: macOS 15+ (Apple Silicon)
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew update
          brew install sfml librtlsdr dylibbundler

      - name: Compile OrbitSDR
        run: |
          chmod +x build.sh
          SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
          SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/macos"
          export CXXFLAGS="-I$SDR_INC -mmacosx-version-min=15.0"
          export LDFLAGS="-L/opt/homebrew/lib -L$SDR_LIB -lsdrplay_api -mmacosx-version-min=15.0 -Wl,-headerpad_max_install_names"
          ./build.sh --enable-sdrplay

      - name: Create .App Bundle with Icon
        run: |
          # 1. Create Directories
          mkdir -p OrbitSDR.app/Contents/MacOS
          mkdir -p OrbitSDR.app/Contents/Frameworks
          mkdir -p OrbitSDR.app/Contents/Resources

          # 2. Copy Binary & resources
          cp orbitsdr OrbitSDR.app/Contents/MacOS/OrbitSDR
          cp bandplan.json OrbitSDR.app/Contents/Resources/ || true
          cp icon.png OrbitSDR.app/Contents/Resources/ || true

          # --- ICON GENERATION START ---
          # macOS requires an .icns file, which contains the icon in multiple resolutions.
          # We use 'sips' to resize your icon.png and 'iconutil' to bundle them.
          mkdir OrbitSDR.iconset
          sips -z 16 16     icon.png --out OrbitSDR.iconset/icon_16x16.png
          sips -z 32 32     icon.png --out OrbitSDR.iconset/icon_16x16@2x.png
          sips -z 32 32     icon.png --out OrbitSDR.iconset/icon_32x32.png
          sips -z 64 64     icon.png --out OrbitSDR.iconset/icon_32x32@2x.png
          sips -z 128 128   icon.png --out OrbitSDR.iconset/icon_128x128.png
          sips -z 256 256   icon.png --out OrbitSDR.iconset/icon_128x128@2x.png
          sips -z 256 256   icon.png --out OrbitSDR.iconset/icon_256x256.png
          sips -z 512 512   icon.png --out OrbitSDR.iconset/icon_256x256@2x.png
          sips -z 512 512   icon.png --out OrbitSDR.iconset/icon_512x512.png
          sips -z 1024 1024 icon.png --out OrbitSDR.iconset/icon_512x512@2x.png

          # Convert the folder into a .icns file
          iconutil -c icns OrbitSDR.iconset

          # Move it to Resources
          cp OrbitSDR.icns OrbitSDR.app/Contents/Resources/
          # --- ICON GENERATION END ---

          # 3. Create Info.plist (includes Icon + minimum macOS version)
          cat > OrbitSDR.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>OrbitSDR</string>
              <key>CFBundleIconFile</key>
              <string>OrbitSDR</string>
              <key>CFBundleIdentifier</key>
              <string>com.orbitsdr.app</string>
              <key>CFBundleName</key>
              <string>OrbitSDR</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSMicrophoneUsageDescription</key>
              <string>OrbitSDR requires audio access to use Line-In and Sound Card sources.</string>
          </dict>
          </plist>
          EOF

          # 4. Bundle ALL dynamic libraries (SFML, rtlsdr, libusb, freetype, SDRplay...) into Frameworks
          # The binary references the SDRplay lib by a bare name ("libsdrplay_api.so.3"), which
          # dylibbundler cannot resolve. So first repoint it to the real file (absolute path).
          SDR_DEP=$(otool -L OrbitSDR.app/Contents/MacOS/OrbitSDR | awk '/sdrplay/ {print $1; exit}')
          if [ -n "$SDR_DEP" ]; then
            mkdir -p sdrlib
            cp deps/sdrplay/lib/macos/libsdrplay_api.dylib "sdrlib/$(basename "$SDR_DEP")"
            install_name_tool -change "$SDR_DEP" "$PWD/sdrlib/$(basename "$SDR_DEP")" OrbitSDR.app/Contents/MacOS/OrbitSDR
          fi

          dylibbundler -cd -of -b \
            -x OrbitSDR.app/Contents/MacOS/OrbitSDR \
            -d OrbitSDR.app/Contents/Frameworks/ \
            -p @executable_path/../Frameworks/ \
            -s /opt/homebrew/lib

          # 5. Show what macOS versions the binary and libs require (for the log)
          otool -L OrbitSDR.app/Contents/MacOS/OrbitSDR
          for f in OrbitSDR.app/Contents/MacOS/OrbitSDR OrbitSDR.app/Contents/Frameworks/*; do
            echo "$(basename "$f"): minos $(otool -l "$f" | awk '/LC_BUILD_VERSION/ {b=1} b && /minos/ {print $2; exit}')"
          done

          # 6. Sign (ad-hoc), libs first, then the app
          for f in OrbitSDR.app/Contents/Frameworks/*; do
            codesign --force --sign - "$f"
          done
          codesign --force --deep --sign - OrbitSDR.app

      - name: Zip and Upload
        run: |
          ditto -c -k --keepParent OrbitSDR.app OrbitSDR-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OrbitSDR-macOS
          path: OrbitSDR-macOS.zip

  # --------------------------------------------------------
  # RELEASE: runs only when you push a tag like v1.0.0
  # Collects every artifact and attaches it to a GitHub Release.
  # --------------------------------------------------------
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-mingw, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
