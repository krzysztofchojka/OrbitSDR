name: Build OrbitSDR

on:
  push:
    branches: [ "main", "master", "test-ci"]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # LINUX BUILD (Based on your working "Old" workflow)
  # ------------------------------------------------------------------
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential librtlsdr-dev libgl1-mesa-dev libudev-dev \
          libopenal-dev libvorbis-dev libflac-dev libfreetype6-dev \
          libx11-dev libxrandr-dev libxcursor-dev libxi-dev

    - name: Install SFML 3.0 (Pre-built)
      run: |
        # Assumes this tar.gz exists in deps/
        tar -xzf $GITHUB_WORKSPACE/deps/SFML-3.0.0-linux-gcc-64-bit.tar.gz
        mv SFML-3.0.0 sfml

    - name: Compile OrbitSDR
      run: |
        chmod +x build.sh
        
        SFML_PATH="$GITHUB_WORKSPACE/sfml"
        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/linux"

        # 1. Headers
        export CXXFLAGS="-I$SFML_PATH/include -I$SDR_INC"
        
        # 2. Linker (Standard linking)
        export LIBS="-L$SFML_PATH/lib -L$SDR_LIB -lsfml-graphics -lsfml-window -lsfml-system -ldl -lpthread -lm -lrtlsdr -lsdrplay_api"
        
        # 3. RPATH (Crucial for portability: looks in ./libs folder)
        export LDFLAGS="-Wl,-rpath,\$ORIGIN/libs"
        
        ./build.sh --enable-sdrplay

    - name: Create Portable Linux Bundle
      run: |
        mkdir -p OrbitSDR_Linux/libs
        cp orbitsdr OrbitSDR_Linux/OrbitSDR
        cp icon.png OrbitSDR_Linux/ || true
        
        # Copy SFML and SDRPlay libs
        cp sfml/lib/*.so* OrbitSDR_Linux/libs/
        cp deps/sdrplay/lib/linux/*.so* OrbitSDR_Linux/libs/
        
        # Create run script
        cat > OrbitSDR_Linux/OrbitSDR_Run.sh <<EOF
        #!/bin/bash
        cd "\$(dirname "\$0")"
        export LD_LIBRARY_PATH="\$LD_LIBRARY_PATH:./libs"
        ./OrbitSDR
        EOF
        chmod +x OrbitSDR_Linux/OrbitSDR_Run.sh

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-Linux
        path: OrbitSDR_Linux/

  # ------------------------------------------------------------------
  # MACOS BUILD (The "Old" Logic + Manual Fix)
  # ------------------------------------------------------------------
  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew update
        brew install sfml librtlsdr

    - name: Compile OrbitSDR
      run: |
        chmod +x build.sh

        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/macos"

        # 1. Headers
        export CXXFLAGS="-I$SDR_INC"

        # 2. Linker
        # We add -Wl,-rpath,@loader_path 
        # This tells the binary: "Look for .dylib files in the same folder as me"
        export LDFLAGS="-L/opt/homebrew/lib -L$SDR_LIB -lsdrplay_api -Wl,-rpath,@loader_path"
        
        ./build.sh --enable-sdrplay

    - name: Manual Bundle (Bypass dylibbundler)
      # Instead of creating a complex .app bundle, we create a folder with the binary + libs
      run: |
        mkdir -p OrbitSDR_MacOS
        
        # 1. Copy the executable
        cp orbitsdr OrbitSDR_MacOS/OrbitSDR
        
        # 2. Copy the SDRPlay library right next to the executable
        # The rpath we set above (@loader_path) will make this work automatically
        cp deps/sdrplay/lib/macos/libsdrplay_api.dylib OrbitSDR_MacOS/
        
        # 3. Fix the library ID (Just to be safe, ensures it doesn't look for absolute paths)
        install_name_tool -id @loader_path/libsdrplay_api.dylib OrbitSDR_MacOS/libsdrplay_api.dylib
        
        # 4. (Optional) Copy SFML libs if you want it strictly standalone, 
        # but usually Homebrew users have them. For now, let's keep it simple.

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-macOS
        path: OrbitSDR_MacOS/