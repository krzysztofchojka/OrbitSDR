name: Build OrbitSDR (Portable)

on:
  push:
    branches: [ "main", "master", "test-ci"]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux (Portable Package)
    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential librtlsdr-dev libopenal-dev libvorbis-dev libflac-dev libfreetype6-dev libudev-dev

    - name: Download & Prepare SFML 3.0
      run: |
        # POPRAWKA: Było "tar tar", zmieniono na "tar"
        tar -xzf $GITHUB_WORKSPACE/deps/SFML-3.0.0-linux-gcc-64-bit.tar.gz
        mv SFML-3.0.0 sfml

    - name: Compile OrbitSDR
      run: |
        chmod +x build.sh
        
        # Definicje ścieżek
        SFML_PATH="$GITHUB_WORKSPACE/sfml"
        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/linux"

        # Kompilacja z flagami wskazującymi na lokalne foldery
        # -Wl,-rpath,'$ORIGIN/libs' -> TO JEST KLUCZ! Mówi: szukaj bibliotek w folderze ./libs obok pliku exe
        export CXXFLAGS="-I$SFML_PATH/include -I$SDR_INC"
        export LDFLAGS="-L$SFML_PATH/lib -L$SDR_LIB -Wl,-rpath,'\$ORIGIN/libs'"
        export LIBS="-lsfml-graphics -lsfml-window -lsfml-system -lsfml-audio -lrtlsdr -lsdrplay_api"
        
        # Uruchamiamy build
        ./build.sh --enable-sdrplay

    - name: Create Portable Linux Bundle
      run: |
        mkdir -p OrbitSDR_Linux/libs
        cp orbitsdr OrbitSDR_Linux/OrbitSDR
        cp icon.png OrbitSDR_Linux/
        
        # Kopiujemy biblioteki SFML i SDRPlay
        cp sfml/lib/*.so* OrbitSDR_Linux/libs/
        cp deps/sdrplay/lib/linux/*.so* OrbitSDR_Linux/libs/
        
        # --- DODAJ TO DLA 100% STANDALONE ---
        # Znajdujemy i kopiujemy librtlsdr oraz libusb z systemu
        cp /usr/lib/x86_64-linux-gnu/librtlsdr.so* OrbitSDR_Linux/libs/ || echo "Warning: librtlsdr not found"
        cp /usr/lib/x86_64-linux-gnu/libusb-1.0.so* OrbitSDR_Linux/libs/ || echo "Warning: libusb not found"
        # ------------------------------------

        cat > OrbitSDR_Linux/OrbitSDR_Run.sh <<EOF
        #!/bin/bash
        cd "\$(dirname "\$0")"
        export LD_LIBRARY_PATH="\$LD_LIBRARY_PATH:./libs"
        ./OrbitSDR
        EOF
        chmod +x OrbitSDR_Linux/OrbitSDR_Run.sh
        chmod +x OrbitSDR_Linux/OrbitSDR

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-Linux-Portable
        path: OrbitSDR_Linux/

  build-macos:
    name: macOS (Universal App)
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew update
        brew install sfml librtlsdr dylibbundler
        # dylibbundler to magiczne narzędzie, które naprawia problem "działa tylko u mnie"

    - name: Compile & Create Bundle
      run: |
        chmod +x build.sh
        
        # --- NAPRAWA ---
        # Zamiast kopiować do /usr/local (co powoduje błąd), wskazujemy ścieżki
        # tak jak w starym pliku build.yml, który działał.
        
        SDR_INC="$GITHUB_WORKSPACE/deps/sdrplay/include"
        SDR_LIB="$GITHUB_WORKSPACE/deps/sdrplay/lib/macos"
        
        # 1. Headers: Wskazujemy folder w deps/sdrplay/include
        export CXXFLAGS="-I$SDR_INC"

        # 2. Linker: Wskazujemy biblioteki w deps ORAZ w Homebrew (dla librtlsdr)
        # -L/opt/homebrew/lib jest kluczowe dla Apple Silicon
        export LDFLAGS="-L/opt/homebrew/lib -L$SDR_LIB -lsdrplay_api"
        
        # Kompilacja (to stworzy OrbitSDR.app dzięki nowemu skryptowi build.sh)
        # build.sh automatycznie "chwyci" te zmienne środowiskowe
        ./build.sh --enable-sdrplay

    - name: Bundle Dependencies (Fix "Library not loaded")
      run: |
        # To jest najważniejszy krok dla macOS!
        # dylibbundler szuka bibliotek (SFML, librtlsdr) w systemie, 
        # kopiuje je do środka .app i naprawia ścieżki.
        # Dodano flagę -s, aby szukał też w deps/sdrplay
        
        dylibbundler -od -b -x ./OrbitSDR.app/Contents/MacOS/OrbitSDR \
          -d ./OrbitSDR.app/Contents/Frameworks/ \
          -p @executable_path/../Frameworks/ \
          -s ./deps/sdrplay/lib/macos/

        # Ponowne podpisanie aplikacji (wymagane po zmianie bibliotek)
        codesign --force --deep --sign - OrbitSDR.app

    - name: Create DMG or Zip
      run: |
        # Pakujemy .app do zipa, żeby zachować uprawnienia plików
        zip -r OrbitSDR-macOS.zip OrbitSDR.app

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrbitSDR-macOS
        path: OrbitSDR-macOS.zip