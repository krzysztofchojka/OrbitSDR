# OrbitSDR configuration (satellite map)
#
# Shipped next to the program. To change it only for yourself, copy it to the
# settings folder (that copy wins):
#   Windows: %APPDATA%\OrbitSDR\orbitsdr.ini
#   macOS / Linux: ~/.config/orbitsdr/orbitsdr.ini
# Lines: key = value, # starts a comment. Every line is optional.

# Caching proxy (server/orbitsdr-api.php). TLEs, transmitter lists and the world map
# are downloaded through it; when it fails OrbitSDR asks CelesTrak / SatNOGS directly.
# Empty = always ask CelesTrak / SatNOGS directly.
api_url = https://bithusky.me/uploads/media/gemini-code-1784840765421.php

# Sent in the X-OrbitSDR-Key header. Public on purpose (OrbitSDR is open source):
api_key = ORBITSDR_APP

# World map picture (equirectangular 2:1, JPEG or PNG). Empty = the proxy, then NASA Blue Marble.
map_url = https://krzysztofchojka.pl/satellite-tracker/nasa.world.topo.bathy.200412.3x5400x2700.jpg
